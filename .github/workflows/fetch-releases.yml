name: Fetch Releases
# Workflow-Datei erneut committed am 2026-10-02, um den schedule-Trigger zu reaktivieren

on:
  schedule:
    - cron: '0 5 * * 5'  # Freitags 05:00 UTC = 06:00 MEZ / 07:00 MESZ
  workflow_dispatch:

jobs:
  sync-and-fetch:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync artist mapping from Spotify to Deezer
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          EXCLUDED_ARTISTS: ${{ secrets.EXCLUDED_ARTISTS }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          node << 'EOF'
          const https = require('https');
          const fs = require('fs');

          function request(options, body = null) {
            return new Promise((resolve, reject) => {
              const req = https.request(options, (res) => {
                let data = '';
                res.on('data', chunk => data += chunk);
                res.on('end', () => {
                  try { resolve({ status: res.statusCode, body: JSON.parse(data) }); }
                  catch { resolve({ status: res.statusCode, body: data }); }
                });
              });
              req.on('error', reject);
              if (body) req.write(body);
              req.end();
            });
          }

          function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
          }

          async function main() {
            const excluded = (process.env.EXCLUDED_ARTISTS || '')
              .split(',').map(s => s.trim().toLowerCase()).filter(Boolean);
            console.log(`Ausgeschlossen: ${excluded.join(', ') || 'keine'}`);

            // Spotify Token
            const credentials = Buffer.from(
              `${process.env.SPOTIFY_CLIENT_ID}:${process.env.SPOTIFY_CLIENT_SECRET}`
            ).toString('base64');

            const tokenRes = await request({
              hostname: 'accounts.spotify.com',
              path: '/api/token',
              method: 'POST',
              headers: {
                'Content-Type': 'application/x-www-form-urlencoded',
                'Authorization': `Basic ${credentials}`
              }
            }, `grant_type=refresh_token&refresh_token=${process.env.SPOTIFY_REFRESH_TOKEN}`);

            const token = tokenRes.body.access_token;
            if (!token) { console.error('Kein Token:', tokenRes.body); process.exit(1); }
            console.log('Spotify Token erhalten.');

            // Rotierten Refresh Token sofort als GitHub Secret sichern (v1.2)
            let secretUpdateFailed = false;
            const newRefresh = tokenRes.body.refresh_token;
            if (newRefresh && newRefresh !== process.env.SPOTIFY_REFRESH_TOKEN) {
              console.log(`::add-mask::${newRefresh}`);
              if (!process.env.GH_PAT) {
                secretUpdateFailed = true;
                console.log('::error::Neuer Refresh Token erhalten, aber Secret GH_PAT fehlt - SPOTIFY_REFRESH_TOKEN nicht aktualisiert.');
              } else {
                try {
                  require('child_process').execFileSync(
                    'gh',
                    ['secret', 'set', 'SPOTIFY_REFRESH_TOKEN', '--repo', process.env.GITHUB_REPOSITORY],
                    { input: newRefresh, env: { ...process.env, GH_TOKEN: process.env.GH_PAT }, stdio: ['pipe', 'pipe', 'pipe'] }
                  );
                  console.log('Neuer Refresh Token als Secret gespeichert.');
                } catch (e) {
                  secretUpdateFailed = true;
                  const msg = (e.stderr ? e.stderr.toString() : e.message).trim().replace(/\n/g, ' ');
                  console.log(`::error::Refresh Token konnte nicht als Secret gespeichert werden: ${msg}`);
                }
              }
            } else {
              console.log('Refresh Token unverändert.');
            }

            // Spotify Follow-Liste
            let artists = [];
            let url = '/v1/me/following?type=artist&limit=50';
            while (url) {
              const res = await request({
                hostname: 'api.spotify.com',
                path: url,
                method: 'GET',
                headers: { 'Authorization': `Bearer ${token}` }
              });
              if (!res.body.artists?.items) break;
              artists = artists.concat(res.body.artists.items);
              const next = res.body.artists.next;
              url = next ? new URL(next).pathname + new URL(next).search : null;
            }
            console.log(`${artists.length} Künstler von Spotify geholt.`);

            const filtered = artists.filter(a => !excluded.includes(a.name.toLowerCase()));
            console.log(`${filtered.length} Künstler nach Ausschluss.`);

            // Bestehende Mappings laden
            let existing = {};
            try {
              const data = JSON.parse(fs.readFileSync('artists.json', 'utf8'));
              data.forEach(a => { existing[a.spotifyName] = a; });
              console.log(`${Object.keys(existing).length} bestehende Mappings geladen.`);
            } catch { console.log('Kein bestehendes Mapping gefunden.'); }

            // Deezer Mapping
            const mapping = [];
            for (const artist of filtered) {
              if (existing[artist.name]) {
                mapping.push(existing[artist.name]);
                continue;
              }
              const query = encodeURIComponent(artist.name);
              const res = await request({
                hostname: 'api.deezer.com',
                path: `/search/artist?q=${query}&strict=on&limit=5`,
                method: 'GET'
              });
              if (!res.body.data || res.body.data.length === 0) {
                console.log(`NICHT GEFUNDEN: ${artist.name}`);
                mapping.push({ spotifyName: artist.name, deezerId: null, deezerName: null });
                await sleep(200);
                continue;
              }
              const nameLower = artist.name.toLowerCase();
              const exact = res.body.data.filter(d => d.name.toLowerCase() === nameLower);
              const candidates = exact.length > 0 ? exact : res.body.data;
              const best = candidates.reduce((a, b) => a.nb_fan > b.nb_fan ? a : b);
              console.log(`GEFUNDEN: ${artist.name} → ${best.name} (ID: ${best.id})`);
              mapping.push({ spotifyName: artist.name, deezerId: best.id, deezerName: best.name });
              await sleep(200);
            }

            fs.writeFileSync('artists.json', JSON.stringify(mapping, null, 2));
            console.log(`${mapping.length} Künstler in artists.json gespeichert.`);
            if (secretUpdateFailed) process.exit(1);
          }

          main().catch(err => { console.error(err); process.exit(1); });
          EOF

      - name: Commit artists.json
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add artists.json
          git diff --staged --quiet || git commit -m "Update artist mapping"
          git push

      - name: Fetch releases from Deezer and write to KV
        if: ${{ !cancelled() }}
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
        run: |
          node << 'EOF'
          const https = require('https');
          const fs = require('fs');

          function request(options, body = null) {
            return new Promise((resolve, reject) => {
              const req = https.request(options, (res) => {
                let data = '';
                res.on('data', chunk => data += chunk);
                res.on('end', () => {
                  try { resolve({ status: res.statusCode, body: JSON.parse(data) }); }
                  catch { resolve({ status: res.statusCode, body: data }); }
                });
              });
              req.on('error', reject);
              if (body) req.write(body);
              req.end();
            });
          }

          function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
          }

          function getWeekFriday(dateStr) {
            const date = new Date(dateStr + 'T12:00:00Z');
            const day = date.getUTCDay();
            const diff = (day >= 5) ? (day - 5) : (day + 2);
            const friday = new Date(date);
            friday.setUTCDate(date.getUTCDate() - diff);
            return friday.toISOString().split('T')[0];
          }

          async function main() {
            const artists = JSON.parse(fs.readFileSync('artists.json', 'utf8'))
              .filter(a => a.deezerId !== null);
            console.log(`${artists.length} Künstler mit Deezer-Mapping geladen.`);

            const lookbackDate = new Date();
            lookbackDate.setDate(lookbackDate.getDate() - 21);
            lookbackDate.setHours(0, 0, 0, 0);
            console.log(`Suche Releases seit: ${lookbackDate.toISOString().split('T')[0]}`); // 21 Tage Lookback

            const newReleases = [];
            for (const artist of artists) {
              const res = await request({
                hostname: 'api.deezer.com',
                path: `/artist/${artist.deezerId}/albums?limit=100`,
                method: 'GET'
              });
              if (!res.body.data) {
                const info = JSON.stringify(res.body).slice(0, 200);
                console.log(`UEBERSPRUNGEN: ${artist.spotifyName} (deezerId ${artist.deezerId}) - Status ${res.status}, Antwort: ${info}`);
                await sleep(300);
                continue;
              }
              for (const album of res.body.data) {
                const releaseDate = new Date(album.release_date + 'T00:00:00Z');
                if (releaseDate >= lookbackDate) {
                  console.log(`NEU: ${artist.spotifyName} - ${album.title} (${album.release_date})`);
                  newReleases.push({
                    id: String(album.id),
                    artist: artist.spotifyName,
                    title: album.title,
                    type: album.record_type,
                    date: album.release_date,
                    weekFriday: getWeekFriday(album.release_date),
                    cover: album.cover_medium,
                    url: `spotify:search:${encodeURIComponent(album.title + " " + artist.spotifyName)}`
                  });
                }
              }
              await sleep(300);
            }
            console.log(`${newReleases.length} neue Releases gefunden.`);

            // Bestehende KV-Daten laden
            let existingReleases = [];
            try {
              const existingRes = await request({
                hostname: 'api.cloudflare.com',
                path: `/client/v4/accounts/${process.env.CF_ACCOUNT_ID}/storage/kv/namespaces/${process.env.CF_KV_NAMESPACE_ID}/values/all_releases`,
                method: 'GET',
                headers: { 'Authorization': `Bearer ${process.env.CF_API_TOKEN}` }
              });
              if (existingRes.status === 200 && Array.isArray(existingRes.body)) {
                existingReleases = existingRes.body;
                console.log(`${existingReleases.length} bestehende Releases geladen.`);
              }
            } catch (e) {
              console.log('KV-Lesen fehlgeschlagen:', e.message);
            }

            // Frische Deezer-Daten überschreiben bestehende Einträge (Datum, Cover, Typ etc.)
            const byId = new Map(existingReleases.map(r => [r.id, r]));
            let updated = 0, added = 0;
            const addedList = [];
            for (const r of newReleases) {
              if (byId.has(r.id)) {
                if (JSON.stringify(byId.get(r.id)) !== JSON.stringify(r)) updated++;
              } else {
                added++;
                addedList.push(r);
              }
              byId.set(r.id, r);
            }
            console.log(`${added} neu hinzugefügt, ${updated} aktualisiert.`);
            const merged = [...byId.values()];
            merged.sort((a, b) => new Date(b.date) - new Date(a.date));
            console.log(`${merged.length} Releases gesamt nach Merge.`);

            const kvRes = await request({
              hostname: 'api.cloudflare.com',
              path: `/client/v4/accounts/${process.env.CF_ACCOUNT_ID}/storage/kv/namespaces/${process.env.CF_KV_NAMESPACE_ID}/values/all_releases`,
              method: 'PUT',
              headers: {
                'Authorization': `Bearer ${process.env.CF_API_TOKEN}`,
                'Content-Type': 'application/json'
              }
            }, JSON.stringify(merged));

            await request({
              hostname: 'api.cloudflare.com',
              path: `/client/v4/accounts/${process.env.CF_ACCOUNT_ID}/storage/kv/namespaces/${process.env.CF_KV_NAMESPACE_ID}/values/last_updated`,
              method: 'PUT',
              headers: {
                'Authorization': `Bearer ${process.env.CF_API_TOKEN}`,
                'Content-Type': 'text/plain'
              }
            }, new Date().toISOString());

            if (kvRes.body.success) {
              console.log('KV erfolgreich geschrieben.');
            } else {
              console.error('KV-Fehler:', JSON.stringify(kvRes.body));
              process.exit(1);
            }

            // WhatsApp-Benachrichtigung via CallMeBot (v1.3)
            const cmbPhone = process.env.CALLMEBOT_PHONE;
            const cmbKey = process.env.CALLMEBOT_APIKEY;
            if (addedList.length > 0 && cmbPhone && cmbKey) {
              try {
                const n = addedList.length;
                const maxLines = 8;
                const lines = addedList.slice(0, maxLines).map(r => `${r.artist} - ${r.title}`);
                if (n > maxLines) lines.push(`... und ${n - maxLines} weitere`);
                const text = [
                  `Dropify: ${n} ${n === 1 ? 'neuer Release' : 'neue Releases'}`,
                  '',
                  ...lines,
                  '',
                  'https://gitarrenteufel.github.io/dropify/'
                ].join('\n');
                const res = await request({
                  hostname: 'api.callmebot.com',
                  path: `/whatsapp.php?phone=${encodeURIComponent(cmbPhone)}&text=${encodeURIComponent(text)}&apikey=${encodeURIComponent(cmbKey)}`,
                  method: 'GET'
                });
                if (res.status === 200) {
                  console.log('WhatsApp-Benachrichtigung gesendet.');
                } else {
                  const info = String(typeof res.body === 'string' ? res.body : JSON.stringify(res.body)).replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 200);
                  console.log(`WhatsApp-Benachrichtigung fehlgeschlagen (Status ${res.status}): ${info}`);
                }
              } catch (e) {
                console.log('WhatsApp-Benachrichtigung fehlgeschlagen:', e.message);
              }
            } else {
              console.log('Keine Benachrichtigung (keine neuen Releases oder CALLMEBOT_PHONE / CALLMEBOT_APIKEY nicht gesetzt).');
            }
          }

          main().catch(err => { console.error(err); process.exit(1); });
          EOF
