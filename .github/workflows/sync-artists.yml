name: Sync Artist Mapping

on:
  workflow_dispatch:  # Manuell auslösbar

jobs:
  sync:
    runs-on: ubuntu-latest

    permissions:
      contents: write  # Für Commit in Repo

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build artist mapping
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          EXCLUDED_ARTISTS: ${{ secrets.EXCLUDED_ARTISTS }}
        run: |
          node << 'EOF'
          const https = require('https');
          const fs = require('fs');

          function request(options, body = null) {
            return new Promise((resolve, reject) => {
              const req = https.request(options, (res) => {
                let data = '';
                res.on('data', chunk => data += chunk);
                res.on('end', () => {
                  try { resolve({ status: res.statusCode, body: JSON.parse(data) }); }
                  catch { resolve({ status: res.statusCode, body: data }); }
                });
              });
              req.on('error', reject);
              if (body) req.write(body);
              req.end();
            });
          }

          function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
          }

          async function main() {
            // Ausgeschlossene Künstler (Hörspiele etc.)
            const excluded = (process.env.EXCLUDED_ARTISTS || '')
              .split(',').map(s => s.trim().toLowerCase()).filter(Boolean);
            console.log(`Ausgeschlossen: ${excluded.join(', ') || 'keine'}`);

            // 1. Spotify Token holen
            const credentials = Buffer.from(
              `${process.env.SPOTIFY_CLIENT_ID}:${process.env.SPOTIFY_CLIENT_SECRET}`
            ).toString('base64');

            const tokenRes = await request({
              hostname: 'accounts.spotify.com',
              path: '/api/token',
              method: 'POST',
              headers: {
                'Content-Type': 'application/x-www-form-urlencoded',
                'Authorization': `Basic ${credentials}`
              }
            }, `grant_type=refresh_token&refresh_token=${process.env.SPOTIFY_REFRESH_TOKEN}`);

            const token = tokenRes.body.access_token;
            if (!token) { console.error('Kein Token:', tokenRes.body); process.exit(1); }
            console.log('Spotify Token erhalten.');

            // 2. Spotify Follow-Liste holen
            let artists = [];
            let url = '/v1/me/following?type=artist&limit=50';
            while (url) {
              const res = await request({
                hostname: 'api.spotify.com',
                path: url,
                method: 'GET',
                headers: { 'Authorization': `Bearer ${token}` }
              });
              if (!res.body.artists?.items) break;
              artists = artists.concat(res.body.artists.items);
              const next = res.body.artists.next;
              url = next ? new URL(next).pathname + new URL(next).search : null;
            }
            console.log(`${artists.length} Künstler von Spotify geholt.`);

            // Ausschluss filtern
            const filtered = artists.filter(a => !excluded.includes(a.name.toLowerCase()));
            console.log(`${filtered.length} Künstler nach Ausschluss.`);

            // 3. Bestehende Mapping laden falls vorhanden
            let existing = {};
            try {
              const data = JSON.parse(fs.readFileSync('artists.json', 'utf8'));
              data.forEach(a => { existing[a.spotifyName] = a; });
              console.log(`${Object.keys(existing).length} bestehende Mappings geladen.`);
            } catch { console.log('Kein bestehendes Mapping gefunden.'); }

            // 4. Deezer Mapping für neue Künstler
            const mapping = [];
            for (const artist of filtered) {
              // Bereits gemappt?
              if (existing[artist.name]) {
                mapping.push(existing[artist.name]);
                continue;
              }

              // Deezer suchen
              const query = encodeURIComponent(artist.name);
              const res = await request({
                hostname: 'api.deezer.com',
                path: `/search/artist?q=${query}&strict=on&limit=5`,
                method: 'GET'
              });

              if (!res.body.data || res.body.data.length === 0) {
                console.log(`NICHT GEFUNDEN: ${artist.name}`);
                mapping.push({ spotifyName: artist.name, deezerId: null, deezerName: null });
                await sleep(200);
                continue;
              }

              // Exakter Namensabgleich zuerst
              const nameLower = artist.name.toLowerCase();
              const exact = res.body.data.filter(d => d.name.toLowerCase() === nameLower);
              const candidates = exact.length > 0 ? exact : res.body.data;
              const best = candidates.reduce((a, b) => a.nb_fan > b.nb_fan ? a : b);

              console.log(`GEFUNDEN: ${artist.name} → ${best.name} (ID: ${best.id}, Fans: ${best.nb_fan})`);
              mapping.push({
                spotifyName: artist.name,
                deezerId: best.id,
                deezerName: best.name
              });
              await sleep(200);
            }

            // 5. Speichern
            fs.writeFileSync('artists.json', JSON.stringify(mapping, null, 2));
            console.log(`${mapping.length} Künstler in artists.json gespeichert.`);
          }

          main().catch(err => { console.error(err); process.exit(1); });
          EOF

      - name: Commit artists.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add artists.json
          git diff --staged --quiet || git commit -m "Update artist mapping"
          git push
