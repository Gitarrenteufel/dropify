<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dropify</title>
  <meta name="theme-color" content="#121212">
  <link rel="manifest" href="manifest.json">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #121212; color: #fff; font-family: -apple-system, sans-serif; max-width: 600px; margin: 0 auto; }

    header { background: #121212; padding: 16px; position: sticky; top: 0; z-index: 10; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; }
    header h1 { font-size: 20px; font-weight: 700; color: #1db954; }
    #last-updated { font-size: 11px; color: #666; }

    .tabs { display: flex; background: #121212; position: sticky; top: 57px; z-index: 9; border-bottom: 1px solid #333; }
    .tab { flex: 1; text-align: center; padding: 12px; font-size: 14px; font-weight: 600; color: #b3b3b3; cursor: pointer; border-bottom: 2px solid transparent; }
    .tab.active { color: #fff; border-bottom-color: #1db954; }

    .filters { padding: 10px 16px; display: flex; gap: 8px; background: #121212; position: sticky; top: 105px; z-index: 8; }
    .filter-pill { font-size: 12px; padding: 4px 12px; border-radius: 20px; border: 1px solid #444; color: #b3b3b3; background: transparent; cursor: pointer; }
    .filter-pill.active { background: #1db954; border-color: #1db954; color: #000; font-weight: 600; }

    #banner { margin: 12px 16px; background: #1db954; border-radius: 8px; padding: 10px 14px; font-size: 13px; color: #000; font-weight: 600; display: none; }

    #content { padding: 0 0 80px; }

    .section-label { font-size: 11px; color: #b3b3b3; text-transform: uppercase; letter-spacing: 0.08em; padding: 12px 16px 6px; }

    .archive-week { border-bottom: 1px solid #2a2a2a; }
    .archive-week-header { padding: 12px 16px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
