<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dropify</title>
  <meta name="theme-color" content="#121212">
  <link rel="manifest" href="manifest.json">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #121212; color: #fff; font-family: -apple-system, sans-serif; max-width: 600px; margin: 0 auto; }

    header { background: #121212; padding: 16px; position: sticky; top: 0; z-index: 10; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; }
    header h1 { font-size: 20px; font-weight: 700; color: #1db954; }
    #last-updated { font-size: 11px; color: #666; }

    .tabs { display: flex; background: #121212; position: sticky; top: 57px; z-index: 9; border-bottom: 1px solid #333; }
    .tab { flex: 1; text-align: center; padding: 12px; font-size: 14px; font-weight: 600; color: #b3b3b3; cursor: pointer; border-bottom: 2px solid transparent; }
    .tab.active { color: #fff; border-bottom-color: #1db954; }

    .filters { padding: 10px 16px; display: flex; gap: 8px; background: #121212; position: sticky; top: 105px; z-index: 8; }
    .filter-pill { font-size: 12px; padding: 4px 12px; border-radius: 20px; border: 1px solid #444; color: #b3b3b3; background: transparent; cursor: pointer; }
    .filter-pill.active { background: #1db954; border-color: #1db954; color: #000; font-weight: 600; }

    #banner { margin: 12px 16px; background: #1db954; border-radius: 8px; padding: 10px 14px; font-size: 13px; color: #000; font-weight: 600; display: none; }

    #playlist-section { padding: 12px 16px; display: none; }
    #playlist-btn { width: 100%; padding: 12px; background: #1db954; border: none; border-radius: 8px; color: #000; font-size: 14px; font-weight: 700; cursor: pointer; }
    #playlist-btn:hover { background: #1ed760; }
    #playlist-btn:disabled { background: #444; color: #888; cursor: default; }
    #playlist-status { margin-top: 8px; font-size: 12px; color: #b3b3b3; text-align: center; display: none; }

    #content { padding: 0 0 80px; }

    .section-label { font-size: 11px; color: #b3b3b3; text-transform: uppercase; letter-spacing: 0.08em; padding: 12px 16px 6px; }

    .archive-week { border-bottom: 1px solid #2a2a2a; }
    .archive-week-header { padding: 12px 16px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
    .archive-week-header:hover { background: #1a1a1a; }
    .archive-week-title { font-size: 13px; font-weight: 600; color: #b3b3b3; }
    .archive-week-count { font-size: 11px; color: #666; }
    .archive-week-chevron { font-size: 12px; color: #666; transition: transform 0.2s; }
    .archive-week-chevron.open { transform: rotate(180deg); }
    .archive-week-items { display: none; }
    .archive-week-items.open { display: block; }

    .release-item { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid #222; cursor: pointer; text-decoration: none; color: inherit; }
    .release-item:hover { background: #1a1a1a; }
    .cover { width: 52px; height: 52px; border-radius: 4px; object-fit: cover; flex-shrink: 0; background: #333; }
    .release-info { flex: 1; min-width: 0; }
    .release-artist { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .release-title { font-size: 13px; color: #b3b3b3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
    .release-meta { display: flex; align-items: center; gap: 6px; margin-top: 4px; }
    .badge { font-size: 10px; padding: 2px 6px; border-radius: 3px; font-weight: 600; }
    .badge-album { background: #1a3a4a; color: #5bb3d0; }
    .badge-single { background: #3a1a3a; color: #c070c0; }
    .badge-ep { background: #3a3a1a; color: #c0b040; }
    .release-date { font-size: 11px; color: #666; }
    .new-dot { width: 7px; height: 7px; border-radius: 50%; background: #1db954; flex-shrink: 0; }

    #loading { text-align: center; padding: 60px 16px; color: #666; }
    #empty { text-align: center; padding: 60px 16px; color: #666; display: none; }
  </style>
</head>
<body>

<header>
  <h1>Dropify <span style="font-size:11px;color:#666;font-weight:400;">v1.1</span></h1>
  <span id="last-updated"></span>
</header>

<div class="tabs">
  <div class="tab active" onclick="setTab('new')">Neu</div>
  <div class="tab" onclick="setTab('upcoming')">Kommend</div>
  <div class="tab" onclick="setTab('archive')">Archiv</div>
</div>

<div class="filters">
  <button class="filter-pill active" onclick="setFilter('all')">Alle</button>
  <button class="filter-pill" onclick="setFilter('album')">Alben</button>
  <button class="filter-pill" onclick="setFilter('single')">Singles</button>
  <button class="filter-pill" onclick="setFilter('ep')">EPs</button>
</div>

<div id="banner"></div>
<div id="playlist-section">
  <button id="playlist-btn" onclick="createPlaylist()">🎵 Playlist erstellen</button>
  <div id="playlist-status"></div>
</div>
<div id="loading">Releases werden geladen…</div>
<div id="empty">Keine Releases vorhanden.</div>
<div id="content"></div>

<script>
  const WORKER_URL = "https://dropify-worker.summer-truth-edd2.workers.dev/";
  const LAST_SEEN_KEY = "dropify_last_seen";
  const FILTER_KEY = "dropify_filter";
  const TAB_KEY = "dropify_tab";
  const TOKEN_KEY = "dropify_sp_token";
  const TOKEN_EXPIRY_KEY = "dropify_sp_expiry";
  const VERIFIER_KEY = "dropify_pkce_verifier";
  const PLAYLIST_PREFIX = "dropify_playlist_";

  let allReleases = [];
  let spotifyClientId = null;
  let currentFilter = localStorage.getItem(FILTER_KEY) || "all";
  let currentTab = localStorage.getItem(TAB_KEY) || "new";

  // Filter-Pills initialisieren
  document.querySelectorAll(".filter-pill").forEach(pill => {
    const text = pill.textContent.toLowerCase();
    const isActive = (currentFilter === "all" && text === "alle") || text === currentFilter;
    pill.classList.toggle("active", isActive);
  });

  // Tab initialisieren
  document.querySelectorAll(".tab").forEach((t, i) => {
    t.classList.toggle("active",
      (currentTab === "new" && i === 0) ||
      (currentTab === "upcoming" && i === 1) ||
      (currentTab === "archive" && i === 2)
    );
  });

  // PKCE Hilfsfunktionen
  function generateRandom(length) {
    const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~';
    return Array.from(crypto.getRandomValues(new Uint8Array(length)))
      .map(b => chars[b % chars.length]).join('');
  }

  async function generateCodeChallenge(verifier) {
    const data = new TextEncoder().encode(verifier);
    const digest = await crypto.subtle.digest('SHA-256', data);
    return btoa(String.fromCharCode(...new Uint8Array(digest)))
      .replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '');
  }

  async function startSpotifyAuth() {
    const verifier = generateRandom(64);
    localStorage.setItem(VERIFIER_KEY, verifier);
    const challenge = await generateCodeChallenge(verifier);
    const params = new URLSearchParams({
      client_id: spotifyClientId,
      response_type: 'code',
      redirect_uri: window.location.origin + window.location.pathname,
      scope: 'playlist-modify-private',
      code_challenge_method: 'S256',
      code_challenge: challenge,
      state: 'playlist'
    });
    window.location.href = 'https://accounts.spotify.com/authorize?' + params.toString();
  }

  async function handleOAuthCallback() {
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code');
    const state = params.get('state');
    if (!code || state !== 'playlist') return;

    const verifier = localStorage.getItem(VERIFIER_KEY);
    if (!verifier) return;

    const res = await fetch('https://accounts.spotify.com/api/token', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: new URLSearchParams({
        client_id: spotifyClientId,
        grant_type: 'authorization_code',
        code,
        redirect_uri: window.location.origin + window.location.pathname,
        code_verifier: verifier
      })
    });
    const data = await res.json();
    if (data.access_token) {
      localStorage.setItem(TOKEN_KEY, data.access_token);
      localStorage.setItem(TOKEN_EXPIRY_KEY, String(Date.now() + data.expires_in * 1000));
      localStorage.removeItem(VERIFIER_KEY);
      window.history.replaceState({}, document.title, window.location.pathname);
      setTimeout(createPlaylist, 300);
    }
  }

  function getValidToken() {
    const token = localStorage.getItem(TOKEN_KEY);
    const expiry = localStorage.getItem(TOKEN_EXPIRY_KEY);
    if (token && expiry && Date.now() < parseInt(expiry)) return token;
    return null;
  }

  async function createPlaylist() {
    const btn = document.getElementById('playlist-btn');
    const status = document.getElementById('playlist-status');
    btn.disabled = true;
    status.style.display = 'block';

    let token = getValidToken();
    if (!token) {
      status.textContent = 'Weiterleitung zu Spotify…';
      localStorage.setItem('dropify_playlist_pending', '1');
      await startSpotifyAuth();
      return;
    }

    try {
      // Nutzer holen
      status.textContent = 'Verbinde mit Spotify…';
      const meRes = await fetch('https://api.spotify.com/v1/me', {
        headers: { Authorization: `Bearer ${token}` }
      });
      const me = await meRes.json();
      const userId = me.id;

      // Aktuelle Woche
      const friday = getCurrentWeekFriday();
      const thursday = getWeekThursday(friday);
      const playlistKey = PLAYLIST_PREFIX + friday;
      const playlistName = `Dropify · ${formatDateShort(friday)} – ${formatDateShort(thursday)}`;
      const weekReleases = allReleases.filter(r => r.date >= friday && r.date <= thursday);

      if (weekReleases.length === 0) {
        status.textContent = 'Keine Releases diese Woche.';
        btn.disabled = false;
        return;
      }

      // Ersten Track pro Release suchen
      status.textContent = 'Suche Tracks…';
      const trackUris = [];
      for (const release of weekReleases) {
        const q = encodeURIComponent(`${release.title} ${release.artist}`);
        const searchRes = await fetch(`https://api.spotify.com/v1/search?q=${q}&type=album&limit=1`, {
          headers: { Authorization: `Bearer ${token}` }
        });
        const searchData = await searchRes.json();
        const album = searchData.albums?.items?.[0];
        if (!album) continue;
        const tracksRes = await fetch(`https://api.spotify.com/v1/albums/${album.id}/tracks?limit=1`, {
          headers: { Authorization: `Bearer ${token}` }
        });
        const tracksData = await tracksRes.json();
        const firstTrack = tracksData.items?.[0];
        if (firstTrack) trackUris.push(firstTrack.uri);
      }

      if (trackUris.length === 0) {
        status.textContent = 'Keine Tracks auf Spotify gefunden.';
        btn.disabled = false;
        return;
      }

      // Playlist erstellen oder aktualisieren
      let playlistId = localStorage.getItem(playlistKey);
      if (!playlistId) {
        status.textContent = 'Erstelle Playlist…';
        const createRes = await fetch(`https://api.spotify.com/v1/users/${userId}/playlists`, {
          method: 'POST',
          headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: playlistName, public: false, description: 'Erstellt von Dropify' })
        });
        const playlist = await createRes.json();
        playlistId = playlist.id;
        localStorage.setItem(playlistKey, playlistId);
      } else {
        status.textContent = 'Prüfe bestehende Tracks…';
        const existRes = await fetch(`https://api.spotify.com/v1/playlists/${playlistId}/tracks?fields=items(track(uri))&limit=50`, {
          headers: { Authorization: `Bearer ${token}` }
        });
        const existData = await existRes.json();
        const existingUris = new Set((existData.items || []).map(i => i.track?.uri).filter(Boolean));
        const newUris = trackUris.filter(u => !existingUris.has(u));
        if (newUris.length === 0) {
          status.textContent = '✅ Playlist bereits aktuell.';
          btn.textContent = '✅ Playlist aktualisieren';
          btn.disabled = false;
          return;
        }
        trackUris.length = 0;
        trackUris.push(...newUris);
      }

      // Tracks hinzufügen
      status.textContent = 'Füge Tracks hinzu…';
      await fetch(`https://api.spotify.com/v1/playlists/${playlistId}/tracks`, {
        method: 'POST',
        headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({ uris: trackUris })
      });

      status.innerHTML = `✅ Fertig! <a href="https://open.spotify.com/playlist/${playlistId}" target="_blank" style="color:#1db954;">In Spotify öffnen →</a>`;
      btn.textContent = '✅ Playlist aktualisieren';
      btn.disabled = false;

    } catch(e) {
      status.textContent = 'Fehler: ' + e.message;
      btn.disabled = false;
    }
  }

  function getToday() {
    return new Date().toISOString().split('T')[0];
  }

  function getCurrentWeekFriday() {
    const today = new Date();
    const day = today.getUTCDay();
    const diff = (day >= 5) ? (day - 5) : (day + 2);
    const friday = new Date(today);
    friday.setUTCDate(today.getUTCDate() - diff);
    return friday.toISOString().split('T')[0];
  }

  function getWeekThursday(fridayStr) {
    const friday = new Date(fridayStr + 'T12:00:00Z');
    const thursday = new Date(friday);
    thursday.setUTCDate(friday.getUTCDate() + 6);
    return thursday.toISOString().split('T')[0];
  }

  function formatDateShort(dateStr) {
    const date = new Date(dateStr + 'T12:00:00Z');
    return date.toLocaleDateString('de-DE', { day: '2-digit', month: 'short', timeZone: 'UTC' });
  }

  function formatDate(dateStr) {
    const today = getToday();
    const yesterday = new Date();
    yesterday.setDate(yesterday.getDate() - 1);
    const yesterdayStr = yesterday.toISOString().split('T')[0];
    if (dateStr === today) return 'heute';
    if (dateStr === yesterdayStr) return 'gestern';
    return formatDateShort(dateStr);
  }

  function isNew(dateStr) {
    const lastSeen = localStorage.getItem(LAST_SEEN_KEY);
    if (!lastSeen) return true;
    return new Date(dateStr + 'T23:59:59Z') > new Date(lastSeen);
  }

  function releaseHTML(r, showDot = true) {
    const badgeClass = r.type === 'album' ? 'badge-album' : r.type === 'single' ? 'badge-single' : 'badge-ep';
    const badgeLabel = r.type === 'album' ? 'Album' : r.type === 'single' ? 'Single' : 'EP';
    const dot = showDot && isNew(r.date) ? '<div class="new-dot"></div>' : '';
    const fallback = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAADAAAAAwCAYAAABXAvmHAAAACXBIWXMAAAsTAAALEwEAmpwYAAAAyklEQVR4nO2YwQqDMBBEX6IH//8ji6ciop3dJA==';
    return `
      <a class="release-item" href="${r.url}" target="_blank">
        <img class="cover" src="${r.cover}" alt="${r.title}" loading="lazy" onerror="this.onerror=null;this.src='${fallback}'">
        <div class="release-info">
          <div class="release-artist">${r.artist}</div>
          <div class="release-title">${r.title}</div>
          <div class="release-meta">
            <span class="badge ${badgeClass}">${badgeLabel}</span>
            <span class="release-date">${formatDate(r.date)}</span>
          </div>
        </div>
        ${dot}
      </a>`;
  }

  function setTab(tab) {
    currentTab = tab;
    localStorage.setItem(TAB_KEY, tab);
    document.querySelectorAll('.tab').forEach((t, i) => {
      t.classList.toggle('active',
        (tab === 'new' && i === 0) ||
        (tab === 'upcoming' && i === 1) ||
        (tab === 'archive' && i === 2)
      );
    });
    render();
  }

  function setFilter(filter) {
    currentFilter = filter;
    localStorage.setItem(FILTER_KEY, filter);
    document.querySelectorAll('.filter-pill').forEach(p => p.classList.remove('active'));
    event.target.classList.add('active');
    render();
  }

  function render() {
    const today = getToday();
    const currentFriday = getCurrentWeekFriday();
    const currentThursday = getWeekThursday(currentFriday);

    const filtered = currentFilter === 'all'
      ? allReleases
      : allReleases.filter(r => r.type === currentFilter);

    const content = document.getElementById('content');
    const empty = document.getElementById('empty');
    const banner = document.getElementById('banner');
    const playlistSection = document.getElementById('playlist-section');
    const playlistBtn = document.getElementById('playlist-btn');

    const newReleases = filtered.filter(r => r.date >= currentFriday && r.date <= currentThursday);
    const upcomingReleases = filtered.filter(r => r.date > currentThursday).sort((a, b) => new Date(a.date) - new Date(b.date));
    const archiveReleases = filtered.filter(r => r.date < currentFriday);

    if (currentTab === 'new') {
      banner.style.display = 'block';
      playlistSection.style.display = newReleases.length > 0 ? 'block' : 'none';
      const playlistKey = PLAYLIST_PREFIX + currentFriday;
      playlistBtn.textContent = localStorage.getItem(playlistKey) ? '✅ Playlist aktualisieren' : '🎵 Playlist erstellen';

      if (newReleases.length === 0) {
        content.innerHTML = '';
        empty.style.display = 'block';
        empty.textContent = 'Keine neuen Releases diese Woche.';
        return;
      }
      empty.style.display = 'none';

      const todayItems = newReleases.filter(r => r.date === today);
      const weekItems = newReleases.filter(r => r.date !== today);
      let html = '';
      if (todayItems.length > 0) {
        html += '<div class="section-label">Heute</div>';
        todayItems.forEach(r => { html += releaseHTML(r); });
      }
      if (weekItems.length > 0) {
        html += '<div class="section-label">Diese Woche</div>';
        weekItems.forEach(r => { html += releaseHTML(r); });
      }
      content.innerHTML = html;

    } else if (currentTab === 'upcoming') {
      banner.style.display = 'none';
      playlistSection.style.display = 'none';
      if (upcomingReleases.length === 0) {
        content.innerHTML = '';
        empty.style.display = 'block';
        empty.textContent = 'Keine kommenden Releases bekannt.';
        return;
      }
      empty.style.display = 'none';
      const weeks = {};
      upcomingReleases.forEach(r => {
        const friday = r.weekFriday;
        if (!weeks[friday]) weeks[friday] = [];
        weeks[friday].push(r);
      });
      const sortedFridays = Object.keys(weeks).sort((a, b) => new Date(a) - new Date(b));
      let html = '';
      sortedFridays.forEach((friday, idx) => {
        const thursday = getWeekThursday(friday);
        const label = `${formatDateShort(friday)} – ${formatDateShort(thursday)}`;
        const count = weeks[friday].length;
        const openClass = idx === 0 ? 'open' : '';
        html += `
          <div class="archive-week">
            <div class="archive-week-header" onclick="toggleWeek('upcoming-${friday}')">
              <span class="archive-week-title">${label}</span>
              <span style="display:flex;align-items:center;gap:8px">
                <span class="archive-week-count">${count} Release${count !== 1 ? 's' : ''}</span>
                <span class="archive-week-chevron ${openClass}" id="chevron-upcoming-${friday}">▼</span>
              </span>
            </div>
            <div class="archive-week-items ${openClass}" id="upcoming-${friday}">
              ${weeks[friday].map(r => releaseHTML(r, false)).join('')}
            </div>
          </div>`;
      });
      content.innerHTML = html;

    } else {
      banner.style.display = 'none';
      playlistSection.style.display = 'none';
      if (archiveReleases.length === 0) {
        content.innerHTML = '';
        empty.style.display = 'block';
        empty.textContent = 'Noch keine archivierten Releases.';
        return;
      }
      empty.style.display = 'none';
      const weeks = {};
      archiveReleases.forEach(r => {
        const friday = r.weekFriday;
        if (!weeks[friday]) weeks[friday] = [];
        weeks[friday].push(r);
      });
      const sortedFridays = Object.keys(weeks).sort((a, b) => new Date(b) - new Date(a));
      let html = '';
      sortedFridays.forEach((friday, idx) => {
        const thursday = getWeekThursday(friday);
        const label = `${formatDateShort(friday)} – ${formatDateShort(thursday)}`;
        const count = weeks[friday].length;
        const openClass = idx === 0 ? 'open' : '';
        html += `
          <div class="archive-week">
            <div class="archive-week-header" onclick="toggleWeek('archive-${friday}')">
              <span class="archive-week-title">${label}</span>
              <span style="display:flex;align-items:center;gap:8px">
                <span class="archive-week-count">${count} Release${count !== 1 ? 's' : ''}</span>
                <span class="archive-week-chevron ${openClass}" id="chevron-archive-${friday}">▼</span>
              </span>
            </div>
            <div class="archive-week-items ${openClass}" id="archive-${friday}">
              ${weeks[friday].map(releaseHTML).join('')}
            </div>
          </div>`;
      });
      content.innerHTML = html;
    }
  }

  function toggleWeek(id) {
    const items = document.getElementById(id);
    const chevron = document.getElementById('chevron-' + id);
    items.classList.toggle('open');
    chevron.classList.toggle('open');
  }

  async function loadReleases() {
    try {
      const res = await fetch(WORKER_URL);
      const data = await res.json();

      allReleases = data.releases || [];
      spotifyClientId = data.clientId || null;

      if (data.updated) {
        const updated = new Date(data.updated);
        document.getElementById('last-updated').textContent =
          `Stand: ${updated.toLocaleDateString('de-DE', { day: '2-digit', month: 'short' })}`;
      }

      const currentFriday = getCurrentWeekFriday();
      const currentThursday = getWeekThursday(currentFriday);
      const lastSeen = localStorage.getItem(LAST_SEEN_KEY);
      const newCount = allReleases.filter(r =>
        r.date >= currentFriday && r.date <= currentThursday &&
        (!lastSeen || new Date(r.date + 'T23:59:59Z') > new Date(lastSeen))
      ).length;

      const banner = document.getElementById('banner');
      if (newCount > 0) {
        banner.textContent = `${newCount} neue Release${newCount > 1 ? 's' : ''} seit deinem letzten Besuch`;
        banner.style.display = currentTab === 'new' ? 'block' : 'none';
      }

      document.getElementById('loading').style.display = 'none';

      // OAuth Callback verarbeiten
      await handleOAuthCallback();

      render();
      localStorage.setItem(LAST_SEEN_KEY, new Date().toISOString());

    } catch (e) {
      document.getElementById('loading').textContent = 'Fehler beim Laden.';
    }
  }

  async function handleOAuthCallback() {
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code');
    const state = params.get('state');
    if (!code || state !== 'playlist' || !spotifyClientId) return;

    const verifier = localStorage.getItem(VERIFIER_KEY);
    if (!verifier) return;

    const res = await fetch('https://accounts.spotify.com/api/token', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: new URLSearchParams({
        client_id: spotifyClientId,
        grant_type: 'authorization_code',
        code,
        redirect_uri: window.location.origin + window.location.pathname,
        code_verifier: verifier
      })
    });
    const data = await res.json();
    if (data.access_token) {
      localStorage.setItem(TOKEN_KEY, data.access_token);
      localStorage.setItem(TOKEN_EXPIRY_KEY, String(Date.now() + data.expires_in * 1000));
      localStorage.removeItem(VERIFIER_KEY);
      window.history.replaceState({}, document.title, window.location.pathname);
      if (localStorage.getItem('dropify_playlist_pending')) {
        localStorage.removeItem('dropify_playlist_pending');
        setTimeout(createPlaylist, 300);
      }
    }
  }

  // Wischfunktion
  let touchStartX = 0;
  const tabOrder = ['new', 'upcoming', 'archive'];
  document.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].screenX; }, { passive: true });
  document.addEventListener('touchend', e => {
    const diff = touchStartX - e.changedTouches[0].screenX;
    if (Math.abs(diff) > 50) {
      const idx = tabOrder.indexOf(currentTab);
      if (diff > 0 && idx < tabOrder.length - 1) setTab(tabOrder[idx + 1]);
      else if (diff < 0 && idx > 0) setTab(tabOrder[idx - 1]);
    }
  }, { passive: true });

  loadReleases();
</script>
</body>
</html>
